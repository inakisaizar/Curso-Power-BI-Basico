<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="60" y="78" font-size="46" font-weight="700" fill="#1F2937">Anatomía de la Vista de modelo</text>
  <text x="60" y="118" font-size="22" fill="#4B5563">Donde se construye la estrella: tablas, relaciones y propiedades.</text>

  <rect x="60" y="150" width="1100" height="690" rx="12" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="2"/>
  <rect x="60" y="150" width="1100" height="34" rx="12" fill="#F2C811"/>
  <rect x="60" y="170" width="1100" height="14" fill="#F2C811"/>
  <text x="80" y="174" font-size="16" font-weight="700" fill="#1F2937">Power BI Desktop</text>

  <rect x="72" y="196" width="56" height="580" rx="6" fill="#FFFFFF" stroke="#F2C811" stroke-width="2.5"/>
  <g fill="#D1D5DB"><rect x="86" y="216" width="28" height="28" rx="4"/><rect x="86" y="264" width="28" height="28" rx="4"/><rect x="86" y="360" width="28" height="28" rx="4"/></g>
  <rect x="80" y="306" width="40" height="40" rx="6" fill="#F2C811"/>
  <g fill="#1F2937"><rect x="88" y="314" width="10" height="10"/><rect x="104" y="330" width="10" height="10"/><line x1="98" y1="320" x2="108" y2="334" stroke="#1F2937" stroke-width="2"/></g>

  <rect x="142" y="196" width="680" height="580" rx="6" fill="#FFFFFF" stroke="#F2C811" stroke-width="2.5"/>
  <g font-size="15">
    <rect x="392" y="400" width="180" height="150" rx="8" fill="#F1FAF9" stroke="#0E7C7B" stroke-width="2"/>
    <rect x="392" y="400" width="180" height="32" rx="8" fill="#0E7C7B"/>
    <text x="406" y="422" fill="#FFFFFF" font-weight="700">FactVentas</text>
    <text x="406" y="456" fill="#1F2937">Fecha</text><text x="406" y="480" fill="#1F2937">IdCliente</text><text x="406" y="504" fill="#1F2937">IdProducto</text><text x="406" y="528" fill="#1F2937">Importe</text>
    <rect x="172" y="230" width="170" height="100" rx="8" fill="#FFF7ED" stroke="#E8743B" stroke-width="2"/>
    <rect x="172" y="230" width="170" height="32" rx="8" fill="#E8743B"/><text x="186" y="252" fill="#FFFFFF" font-weight="700">DimCliente</text>
    <text x="186" y="286" fill="#1F2937">IdCliente</text><text x="186" y="310" fill="#1F2937">Provincia</text>
    <rect x="622" y="230" width="170" height="100" rx="8" fill="#FFF7ED" stroke="#E8743B" stroke-width="2"/>
    <rect x="622" y="230" width="170" height="32" rx="8" fill="#E8743B"/><text x="636" y="252" fill="#FFFFFF" font-weight="700">DimProducto</text>
    <text x="636" y="286" fill="#1F2937">IdProducto</text><text x="636" y="310" fill="#1F2937">Familia</text>
    <rect x="172" y="620" width="170" height="100" rx="8" fill="#FFF7ED" stroke="#E8743B" stroke-width="2"/>
    <rect x="172" y="620" width="170" height="32" rx="8" fill="#E8743B"/><text x="186" y="642" fill="#FFFFFF" font-weight="700">DimFecha</text>
    <text x="186" y="676" fill="#1F2937">Fecha</text><text x="186" y="700" fill="#1F2937">Mes nombre</text>
    <rect x="622" y="620" width="170" height="100" rx="8" fill="#FFF7ED" stroke="#E8743B" stroke-width="2"/>
    <rect x="622" y="620" width="170" height="32" rx="8" fill="#E8743B"/><text x="636" y="642" fill="#FFFFFF" font-weight="700">DimRuta</text>
    <text x="636" y="676" fill="#1F2937">IdRuta</text><text x="636" y="700" fill="#1F2937">Ruta</text>
  </g>
  <g stroke="#6B7280" stroke-width="2.5" fill="none">
    <line x1="342" y1="300" x2="392" y2="430"/><line x1="622" y1="300" x2="572" y2="430"/>
    <line x1="342" y1="660" x2="392" y2="530"/><line x1="622" y1="660" x2="572" y2="530"/>
  </g>
  <g font-size="16" font-weight="700" fill="#1F2937">
    <text x="350" y="322">1</text><text x="376" y="424">*</text>
    <text x="604" y="322">1</text><text x="580" y="424">*</text>
    <text x="350" y="652">1</text><text x="376" y="548">*</text>
    <text x="604" y="652">1</text><text x="580" y="548">*</text>
  </g>

  <rect x="836" y="196" width="150" height="580" rx="6" fill="#FFFFFF" stroke="#F2C811" stroke-width="2.5"/>
  <text x="848" y="224" font-size="15" font-weight="700" fill="#1F2937">Propiedades</text>
  <g font-size="13" fill="#4B5563"><text x="848" y="256">Nombre</text><text x="848" y="300">Descripción</text><text x="848" y="344">Está oculto</text><text x="848" y="388">Formato</text></g>
  <g fill="#F3F4F6"><rect x="848" y="262" width="124" height="20" rx="3"/><rect x="848" y="306" width="124" height="20" rx="3"/><rect x="848" y="350" width="40" height="20" rx="10"/><rect x="848" y="394" width="124" height="20" rx="3"/></g>
  <rect x="998" y="196" width="150" height="580" rx="6" fill="#FFFFFF" stroke="#F2C811" stroke-width="2.5"/>
  <text x="1010" y="224" font-size="15" font-weight="700" fill="#1F2937">Datos</text>
  <g font-size="13" fill="#1F2937"><text x="1010" y="256">Tablas | Modelo</text><text x="1010" y="292">DimCliente</text><text x="1010" y="318">DimFecha</text><text x="1010" y="344">DimProducto</text><text x="1010" y="370">DimRuta</text><text x="1010" y="396">FactVentas</text></g>

  <rect x="142" y="788" width="1006" height="40" rx="6" fill="#FFFFFF" stroke="#F2C811" stroke-width="2.5"/>
  <rect x="154" y="796" width="150" height="24" rx="4" fill="#FEF3C7"/>
  <text x="166" y="814" font-size="15" font-weight="700" fill="#1F2937">Todas las tablas</text>
  <text x="318" y="815" font-size="20" font-weight="700" fill="#1F2937">+</text>

  <g font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <circle cx="128" cy="200" r="18" fill="#0E7C7B"/><text x="128" y="207">1</text>
    <circle cx="806" cy="214" r="18" fill="#0E7C7B"/><text x="806" y="221">2</text>
    <circle cx="482" cy="370" r="18" fill="#0E7C7B"/><text x="482" y="377">3</text>
    <circle cx="972" cy="760" r="18" fill="#0E7C7B"/><text x="972" y="767">4</text>
    <circle cx="1134" cy="760" r="18" fill="#0E7C7B"/><text x="1134" y="767">5</text>
    <circle cx="1134" cy="808" r="18" fill="#0E7C7B"/><text x="1134" y="815">6</text>
  </g>

  <g font-size="18" fill="#1F2937">
    <circle cx="1210" cy="186" r="15" fill="#0E7C7B"/><text x="1210" y="192" text-anchor="middle" fill="#FFF" font-weight="700" font-size="16">1</text>
    <text x="1236" y="182" font-weight="700">Barra de vistas</text>
    <text x="1236" y="206" font-size="16" fill="#4B5563">Informe, tabla, modelo, DAX</text>

    <circle cx="1210" cy="276" r="15" fill="#0E7C7B"/><text x="1210" y="282" text-anchor="middle" fill="#FFF" font-weight="700" font-size="16">2</text>
    <text x="1236" y="272" font-weight="700">Lienzo</text>
    <text x="1236" y="296" font-size="16" fill="#4B5563">Cada tabla es una tarjeta.</text>
    <text x="1236" y="316" font-size="16" fill="#4B5563">Arrastra para ordenarlas</text>

    <circle cx="1210" cy="376" r="15" fill="#0E7C7B"/><text x="1210" y="382" text-anchor="middle" fill="#FFF" font-weight="700" font-size="16">3</text>
    <text x="1236" y="372" font-weight="700">Relaciones</text>
    <text x="1236" y="396" font-size="16" fill="#4B5563">Líneas con 1 y * en los</text>
    <text x="1236" y="416" font-size="16" fill="#4B5563">extremos. Arrastra una clave</text>
    <text x="1236" y="436" font-size="16" fill="#4B5563">sobre otra para crearlas</text>

    <circle cx="1210" cy="496" r="15" fill="#0E7C7B"/><text x="1210" y="502" text-anchor="middle" fill="#FFF" font-weight="700" font-size="16">4</text>
    <text x="1236" y="492" font-weight="700">Propiedades</text>
    <text x="1236" y="516" font-size="16" fill="#4B5563">De lo que selecciones: nombre,</text>
    <text x="1236" y="536" font-size="16" fill="#4B5563">formato, visible u oculto</text>

    <circle cx="1210" cy="596" r="15" fill="#0E7C7B"/><text x="1210" y="602" text-anchor="middle" fill="#FFF" font-weight="700" font-size="16">5</text>
    <text x="1236" y="592" font-weight="700">Datos</text>
    <text x="1236" y="616" font-size="16" fill="#4B5563">Tablas y columnas; en Modelo,</text>
    <text x="1236" y="636" font-size="16" fill="#4B5563">también relaciones y medidas</text>

    <circle cx="1210" cy="696" r="15" fill="#0E7C7B"/><text x="1210" y="702" text-anchor="middle" fill="#FFF" font-weight="700" font-size="16">6</text>
    <text x="1236" y="692" font-weight="700">Disposiciones</text>
    <text x="1236" y="716" font-size="16" fill="#4B5563">Vistas parciales del modelo,</text>
    <text x="1236" y="736" font-size="16" fill="#4B5563">por ejemplo una por estrella</text>
  </g>
  <rect x="1190" y="770" width="350" height="70" rx="10" fill="#FEF3C7"/>
  <text x="1206" y="800" font-size="16" fill="#1F2937" font-weight="700">Hechos en el centro,</text>
  <text x="1206" y="824" font-size="16" fill="#1F2937">dimensiones alrededor.</text>
</svg>
