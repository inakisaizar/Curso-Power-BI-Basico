<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="60" y="78" font-size="46" font-weight="700" fill="#1F2937">Qué gráfico para qué pregunta</text>
  <text x="60" y="118" font-size="22" fill="#4B5563">Primero la pregunta. Después el objeto visual.</text>

  <rect x="60" y="160" width="270" height="460" rx="14" fill="#FFF7ED" stroke="#E8743B" stroke-width="2"/>
  <text x="195" y="206" font-size="24" font-weight="700" fill="#C2410C" text-anchor="middle">¿Cuánto?</text>
  <rect x="95" y="240" width="200" height="130" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <text x="195" y="312" font-size="36" font-weight="700" fill="#1F2937" text-anchor="middle">415,7 mil</text>
  <text x="195" y="346" font-size="16" fill="#6B7280" text-anchor="middle">Ventas</text>
  <text x="195" y="430" font-size="22" font-weight="700" fill="#1F2937" text-anchor="middle">Tarjeta</text>
  <text x="195" y="470" font-size="17" fill="#4B5563" text-anchor="middle">Una cifra clave</text>

  <rect x="360" y="160" width="270" height="460" rx="14" fill="#FFF7ED" stroke="#E8743B" stroke-width="2"/>
  <text x="495" y="206" font-size="24" font-weight="700" fill="#C2410C" text-anchor="middle">¿Quién más?</text>
  <g fill="#E8743B"><rect x="395" y="245" width="200" height="22" rx="3"/><rect x="395" y="277" width="170" height="22" rx="3" opacity="0.85"/><rect x="395" y="309" width="120" height="22" rx="3" opacity="0.7"/><rect x="395" y="341" width="80" height="22" rx="3" opacity="0.55"/></g>
  <text x="495" y="430" font-size="22" font-weight="700" fill="#1F2937" text-anchor="middle">Barras</text>
  <text x="495" y="470" font-size="17" fill="#4B5563" text-anchor="middle">Comparar categorías,</text>
  <text x="495" y="494" font-size="17" fill="#4B5563" text-anchor="middle">de mayor a menor</text>

  <rect x="660" y="160" width="270" height="460" rx="14" fill="#FFF7ED" stroke="#E8743B" stroke-width="2"/>
  <text x="795" y="206" font-size="24" font-weight="700" fill="#C2410C" text-anchor="middle">¿Cómo evoluciona?</text>
  <polyline points="695,350 735,320 775,330 815,285 855,295 895,255" fill="none" stroke="#E8743B" stroke-width="4"/>
  <polyline points="695,360 735,345 775,350 815,325 855,335 895,310" fill="none" stroke="#9CA3AF" stroke-width="3" stroke-dasharray="6 5"/>
  <line x1="690" y1="372" x2="900" y2="372" stroke="#D1D5DB" stroke-width="2"/>
  <text x="795" y="430" font-size="22" font-weight="700" fill="#1F2937" text-anchor="middle">Líneas</text>
  <text x="795" y="470" font-size="17" fill="#4B5563" text-anchor="middle">El tiempo en el eje X;</text>
  <text x="795" y="494" font-size="17" fill="#4B5563" text-anchor="middle">el año anterior, al lado</text>

  <rect x="960" y="160" width="270" height="460" rx="14" fill="#FFF7ED" stroke="#E8743B" stroke-width="2"/>
  <text x="1095" y="206" font-size="24" font-weight="700" fill="#C2410C" text-anchor="middle">¿El detalle?</text>
  <rect x="995" y="240" width="200" height="26" fill="#F3F4F6"/>
  <g stroke="#E5E7EB" stroke-width="2"><line x1="995" y1="296" x2="1195" y2="296"/><line x1="995" y1="326" x2="1195" y2="326"/><line x1="995" y1="356" x2="1195" y2="356"/><line x1="1075" y1="240" x2="1075" y2="370"/><line x1="1135" y1="240" x2="1135" y2="370"/></g>
  <text x="1095" y="430" font-size="22" font-weight="700" fill="#1F2937" text-anchor="middle">Matriz</text>
  <text x="1095" y="470" font-size="17" fill="#4B5563" text-anchor="middle">Cifras exactas,</text>
  <text x="1095" y="494" font-size="17" fill="#4B5563" text-anchor="middle">varias medidas</text>

  <rect x="1260" y="160" width="280" height="460" rx="14" fill="#F1FAF9" stroke="#0E7C7B" stroke-width="2"/>
  <text x="1400" y="206" font-size="24" font-weight="700" fill="#0E7C7B" text-anchor="middle">¿Qué quiero ver?</text>
  <rect x="1300" y="250" width="90" height="40" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/><text x="1345" y="277" font-size="17" fill="#1F2937" text-anchor="middle">2024</text>
  <rect x="1410" y="250" width="90" height="40" rx="6" fill="#0E7C7B"/><text x="1455" y="277" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">2025</text>
  <text x="1400" y="430" font-size="22" font-weight="700" fill="#1F2937" text-anchor="middle">Segmentación</text>
  <text x="1400" y="470" font-size="17" fill="#4B5563" text-anchor="middle">El usuario elige</text>
  <text x="1400" y="494" font-size="17" fill="#4B5563" text-anchor="middle">el filtro</text>

  <rect x="60" y="660" width="1480" height="180" rx="12" fill="#FEF3C7"/>
  <text x="84" y="704" font-size="22" font-weight="700" fill="#1F2937">Tres consejos</text>
  <g font-size="20" fill="#1F2937">
    <text x="84" y="744">· Ordena las barras de mayor a menor.</text>
    <text x="84" y="780">· Usa el color para destacar, no para decorar.</text>
    <text x="84" y="816">· Una página, una pregunta principal.</text>
  </g>
</svg>
