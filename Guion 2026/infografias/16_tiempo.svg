<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="60" y="78" font-size="46" font-weight="700" fill="#1F2937">Año anterior y acumulado</text>
  <text x="60" y="118" font-size="22" fill="#4B5563">Qué meses suma cada medida cuando la celda es marzo de 2025.</text>

  <g font-size="17" font-weight="700" fill="#4B5563" text-anchor="middle">
    <text x="420" y="190">E</text><text x="510" y="190">F</text><text x="600" y="190">M</text><text x="690" y="190">A</text><text x="780" y="190">M</text><text x="870" y="190">J</text>
    <text x="960" y="190">J</text><text x="1050" y="190">A</text><text x="1140" y="190">S</text><text x="1230" y="190">O</text><text x="1320" y="190">N</text><text x="1410" y="190">D</text>
  </g>

  <g font-size="19" fill="#1F2937">
    <text x="60" y="246" font-weight="700">Ventas</text><text x="60" y="270" font-size="15" fill="#6B7280">marzo 2025</text>
    <g fill="#E5E7EB"><rect x="380" y="226" width="80" height="40" rx="6"/><rect x="470" y="226" width="80" height="40" rx="6"/><rect x="650" y="226" width="80" height="40" rx="6"/><rect x="740" y="226" width="80" height="40" rx="6"/><rect x="830" y="226" width="80" height="40" rx="6"/><rect x="920" y="226" width="80" height="40" rx="6"/><rect x="1010" y="226" width="80" height="40" rx="6"/><rect x="1100" y="226" width="80" height="40" rx="6"/><rect x="1190" y="226" width="80" height="40" rx="6"/><rect x="1280" y="226" width="80" height="40" rx="6"/><rect x="1370" y="226" width="80" height="40" rx="6"/></g>
    <rect x="560" y="226" width="80" height="40" rx="6" fill="#0E7C7B"/>
    <text x="1490" y="252" font-size="17" fill="#0E7C7B" font-weight="700">2025</text>

    <text x="60" y="336" font-weight="700">Ventas AA</text><text x="60" y="360" font-size="15" fill="#6B7280">marzo 2024</text>
    <g fill="#E5E7EB"><rect x="380" y="316" width="80" height="40" rx="6"/><rect x="470" y="316" width="80" height="40" rx="6"/><rect x="650" y="316" width="80" height="40" rx="6"/><rect x="740" y="316" width="80" height="40" rx="6"/><rect x="830" y="316" width="80" height="40" rx="6"/><rect x="920" y="316" width="80" height="40" rx="6"/><rect x="1010" y="316" width="80" height="40" rx="6"/><rect x="1100" y="316" width="80" height="40" rx="6"/><rect x="1190" y="316" width="80" height="40" rx="6"/><rect x="1280" y="316" width="80" height="40" rx="6"/><rect x="1370" y="316" width="80" height="40" rx="6"/></g>
    <rect x="560" y="316" width="80" height="40" rx="6" fill="#E8743B"/>
    <text x="1490" y="342" font-size="17" fill="#C2410C" font-weight="700">2024</text>

    <text x="60" y="426" font-weight="700">Ventas YTD</text><text x="60" y="450" font-size="15" fill="#6B7280">enero a marzo 2025</text>
    <g fill="#E5E7EB"><rect x="650" y="406" width="80" height="40" rx="6"/><rect x="740" y="406" width="80" height="40" rx="6"/><rect x="830" y="406" width="80" height="40" rx="6"/><rect x="920" y="406" width="80" height="40" rx="6"/><rect x="1010" y="406" width="80" height="40" rx="6"/><rect x="1100" y="406" width="80" height="40" rx="6"/><rect x="1190" y="406" width="80" height="40" rx="6"/><rect x="1280" y="406" width="80" height="40" rx="6"/><rect x="1370" y="406" width="80" height="40" rx="6"/></g>
    <g fill="#0E7C7B"><rect x="380" y="406" width="80" height="40" rx="6"/><rect x="470" y="406" width="80" height="40" rx="6"/><rect x="560" y="406" width="80" height="40" rx="6"/></g>
    <text x="1490" y="432" font-size="17" fill="#0E7C7B" font-weight="700">2025</text>

    <text x="60" y="516" font-weight="700">Ventas YTD AA</text><text x="60" y="540" font-size="15" fill="#6B7280">enero a marzo 2024</text>
    <g fill="#E5E7EB"><rect x="650" y="496" width="80" height="40" rx="6"/><rect x="740" y="496" width="80" height="40" rx="6"/><rect x="830" y="496" width="80" height="40" rx="6"/><rect x="920" y="496" width="80" height="40" rx="6"/><rect x="1010" y="496" width="80" height="40" rx="6"/><rect x="1100" y="496" width="80" height="40" rx="6"/><rect x="1190" y="496" width="80" height="40" rx="6"/><rect x="1280" y="496" width="80" height="40" rx="6"/><rect x="1370" y="496" width="80" height="40" rx="6"/></g>
    <g fill="#E8743B"><rect x="380" y="496" width="80" height="40" rx="6"/><rect x="470" y="496" width="80" height="40" rx="6"/><rect x="560" y="496" width="80" height="40" rx="6"/></g>
    <text x="1490" y="522" font-size="17" fill="#C2410C" font-weight="700">2024</text>
  </g>

  <rect x="60" y="600" width="1480" height="240" rx="14" fill="#FFF7ED" stroke="#E8743B" stroke-width="2"/>
  <text x="84" y="644" font-size="22" font-weight="700" fill="#C2410C">La trampa del año incompleto</text>
  <text x="84" y="680" font-size="18" fill="#1F2937">Los datos de 2025 acaban el 21 de octubre.</text>
  <g font-size="19" fill="#1F2937">
    <rect x="84" y="704" width="680" height="110" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="108" y="742" font-weight="700">Año completo frente a año completo</text>
    <text x="108" y="778">Casi 10 meses de 2025 frente a 12 de 2024:</text>
    <text x="660" y="778" font-weight="700" fill="#B91C1C">−19,66 %</text>
    <rect x="836" y="704" width="680" height="110" rx="10" fill="#FFFFFF" stroke="#0E7C7B" stroke-width="2"/>
    <text x="860" y="742" font-weight="700">Enero a septiembre frente a enero a septiembre</text>
    <text x="860" y="778">Periodos equivalentes:</text>
    <text x="1420" y="778" font-weight="700" fill="#047857">+2,28 %</text>
  </g>
</svg>
