<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E8743B"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="60" y="78" font-size="46" font-weight="700" fill="#1F2937">Cómo se calcula una celda</text>
  <text x="60" y="118" font-size="22" fill="#4B5563">La fórmula es siempre la misma. Lo que cambia en cada celda son los filtros: el contexto de filtro.</text>

  <text x="60" y="180" font-size="20" font-weight="700" fill="#0E7C7B">1 · LA CELDA</text>
  <rect x="60" y="200" width="440" height="300" rx="12" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
  <rect x="80" y="216" width="160" height="34" rx="17" fill="#FEF3C7" stroke="#F2C811"/>
  <text x="160" y="239" font-size="16" fill="#1F2937" text-anchor="middle">Ejercicio: 2025</text>
  <rect x="80" y="266" width="400" height="36" fill="#F3F4F6"/>
  <g font-size="17" fill="#1F2937"><text x="96" y="290" font-weight="700">Familia</text><text x="464" y="290" font-weight="700" text-anchor="end">Ventas</text>
    <text x="96" y="332">FAMILIA MARTINEZ ZABALA</text><text x="464" y="332" text-anchor="end">59.988</text>
    <rect x="80" y="346" width="400" height="38" fill="#FFF7ED" stroke="#E8743B" stroke-width="2.5"/>
    <text x="96" y="372" font-weight="700">CERVEBEL</text><text x="464" y="372" text-anchor="end" font-weight="700">57.294</text>
    <text x="96" y="412">CONSERVAS MAR</text><text x="464" y="412" text-anchor="end">32.478</text>
    <text x="96" y="452">...</text><text x="464" y="452" text-anchor="end">...</text>
  </g>

  <text x="580" y="180" font-size="20" font-weight="700" fill="#0E7C7B">2 · SUS FILTROS</text>
  <rect x="580" y="200" width="420" height="300" rx="12" fill="#FFF7ED" stroke="#E8743B" stroke-width="2"/>
  <g font-size="18" fill="#1F2937">
    <text x="604" y="246" font-weight="700">De la fila</text><text x="604" y="274">DimProducto[Familia] = CERVEBEL</text>
    <text x="604" y="324" font-weight="700">De la segmentación</text><text x="604" y="352">DimFecha[Ejercicio] = 2025</text>
    <text x="604" y="402" font-weight="700">De la página o el informe</text><text x="604" y="430">si los hay</text>
  </g>
  <line x1="504" y1="365" x2="572" y2="365" stroke="#E8743B" stroke-width="4" marker-end="url(#a)"/>

  <text x="1080" y="180" font-size="20" font-weight="700" fill="#0E7C7B">3 · CAEN A LOS HECHOS</text>
  <rect x="1080" y="200" width="460" height="300" rx="12" fill="#F1FAF9" stroke="#0E7C7B" stroke-width="2"/>
  <text x="1104" y="240" font-size="20" font-weight="700" fill="#0E7C7B">FactVentas</text>
  <g>
    <rect x="1104" y="258" width="412" height="26" fill="#E5E7EB"/><rect x="1104" y="290" width="412" height="26" fill="#0E7C7B" opacity="0.8"/>
    <rect x="1104" y="322" width="412" height="26" fill="#E5E7EB"/><rect x="1104" y="354" width="412" height="26" fill="#E5E7EB"/>
    <rect x="1104" y="386" width="412" height="26" fill="#0E7C7B" opacity="0.8"/><rect x="1104" y="418" width="412" height="26" fill="#E5E7EB"/>
  </g>
  <text x="1104" y="478" font-size="17" fill="#1F2937">Solo quedan las líneas de CERVEBEL en 2025</text>
  <line x1="1004" y1="365" x2="1072" y2="365" stroke="#E8743B" stroke-width="4" marker-end="url(#a)"/>

  <rect x="60" y="560" width="1480" height="130" rx="14" fill="#F5F3FF" stroke="#7B61FF" stroke-width="2.5"/>
  <text x="84" y="604" font-size="20" font-weight="700" fill="#5B21B6">4 · LA MEDIDA CALCULA SOBRE LO QUE QUEDA</text>
  <text x="84" y="652" font-size="24" fill="#1F2937" font-family="Consolas, Courier New, monospace">Ventas = SUM ( FactVentas[Importe] )   →   57.294</text>

  <rect x="60" y="720" width="1480" height="120" rx="12" fill="#FEF3C7"/>
  <text x="84" y="764" font-size="21" font-weight="700" fill="#1F2937">Medida: se calcula en cada celda, con sus filtros.</text>
  <text x="84" y="802" font-size="19" fill="#1F2937">Columna calculada: se calcula una vez por fila al cargar los datos y no cambia con los filtros.</text>
</svg>
